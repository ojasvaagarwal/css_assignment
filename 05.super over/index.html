<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stadium">
        <div class="top-badge">
            <span>🏏</span>
            <div>
                <h3>SUPER</h3>
                <h3>OVER</h3>
            </div>
        </div>
        <div class="board-row">
            <div class="team-box team-ind">
                <h1>IND</h1>
                <div class="ball-list">
                    <span>4</span>
                    <span>3</span>
                    <span>2</span>
                    <span>6</span>
                    <span>6</span>
                    <span>6</span>
                </div>
                <h2>27/0</h2>
            </div>
            <div class="team-box team-pak">
                <h1>PAK</h1>
                <div class="ball-list">
                    <span>2</span>
                    <span>4</span>
                    <span>0</span>
                    <span>3</span>
                    <span>1</span>
                    <span>4</span>
                </div>
                <h2>14/0</h2>
            </div>
        </div>
        <div class="controls">
            <button class="edit-btn">✎</button>
            <button class="reset-btn">⟲</button>
        </div>
    </div>
</body>
</html>
